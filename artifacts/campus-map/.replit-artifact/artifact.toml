kind = "web"
previewPath = "/"
title = "Queen's Campus Map"
version = "1.0.0"
id = "artifacts/campus-map"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19316

[services.development]
run = "pnpm --filter @workspace/campus-map run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campus-map", "run", "build" ]
publicDir = "artifacts/campus-map/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19316"
BASE_PATH = "/"
